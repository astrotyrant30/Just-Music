name: Build & Publish APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleDebug

      - name: Prepare Release Asset
        run: |
          mkdir -p release-asset
          cp app/build/outputs/apk/debug/app-debug.apk release-asset/JustMusic-${{ github.ref_name }}.apk

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JustMusic-${{ github.ref_name }}-APK
          path: release-asset/*.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          files: release-asset/*.apk
          generate_release_notes: true
